<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn Xin Gia Nhập Băng Đảng Sít Đát</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 40px auto;
            background: #1e1e1e;
            border: 2px solid #d32f2f;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(211, 47, 47, 0.4);
            overflow: hidden;
        }
        .header {
            background: #d32f2f;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .header h1 { font-size: 22px; text-transform: uppercase; letter-spacing: 2px; }
        .image-container {
            text-align: center;
            padding: 20px;
            background: #181818;
            border-bottom: 1px solid #333;
        }
        .image-container img {
            max-width: 100%;
            height: auto;
            max-height: 250px;
            border-radius: 5px;
            border: 1px solid #444;
        }
        .form-content { padding: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #ff5252; font-weight: bold; }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            background: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
            font-size: 16px;
        }
        input[type="text"]:focus, textarea:focus { outline: none; border-color: #d32f2f; }
        textarea { resize: vertical; height: 100px; }
        .btn-submit {
            background: #d32f2f;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.3s;
        }
        .btn-submit:hover { background: #b71c1c; }
        .step { display: none; }
        .step.active { display: block; }
        .choices { display: flex; gap: 15px; margin-top: 20px; }
        .choices button { flex: 1; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; border: none; }
        .btn-accept { background: #2e7d32; color: white; }
        .btn-accept:hover { background: #1b5e20; }
        .btn-no-choice { background: #d32f2f; color: white; position: relative; }
        .success-box { text-align: center; padding: 20px; }
        .success-box h2 { color: #4caf50; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 id="header-title">Hệ Thống Tuyển Quân Sít Đát</h1>
    </div>

    <!-- TRANG 1: Nhập tên người duyệt -->
    <div id="step-1" class="step active">
        <div class="form-content">
            <div class="form-group">
                <label for="reviewer-name">Xin vui lòng cho biết danh tính người duyệt đơn:</label>
                <input type="text" id="reviewer-name" placeholder="Nhập tên của bạn vào đây...">
            </div>
            <button type="button" class="btn-submit" onclick="goToStep2()">Tiếp Tục Xem Đơn</button>
        </div>
    </div>

    <!-- TRANG 2: Nội dung đơn xin gia nhập (Bạn có sẵn text) -->
    <div id="step-2" class="step">
        <div class="image-container">
            <img src="https://images.unsplash.com/photo-1542332213-9b5a5a3fad35?auto=format&fit=crop&w=600&q=80" alt="Băng đảng Sít Đát">
        </div>
        <div class="form-content">
            <form id="apply-form" action="https://formspree.io/f/xoeezezp" method="POST">
                <!-- Lưu tên người duyệt ngầm để gửi về mail -->
                <input type="hidden" id="hidden-reviewer" name="Nguoi_Duyet">

                <div class="form-group">
                    <label>1. Họ và tên ứng viên:</label>
                    <input type="text" name="Ho_Ten" value="Nguyễn Hoàng Thông" readonly>
                </div>

                <div class="form-group">
                    <label>2. Biệt danh trong giới:</label>
                    <input type="text" name="Biet_Danh" value="honthon" readonly>
                </div>

                <div class="form-group">
                    <label>3. Kỹ năng / Sở trường đặc biệt:</label>
                    <textarea name="Ky_Nang" readonly>Trùm cào phím, tấu hài khét tiếng, chạy nhanh khi thấy công an.</textarea>
                </div>

                <div class="form-group">
                    <label>4. Lý do muốn gia nhập:</label>
                    <textarea name="Ly_Do" readonly>Vì ngưỡng mộ độ uy tín của băng đảng Sít Đát từ lâu.</textarea>
                </div>

                <div class="form-group">
                    <label>5. Lời thề:</label>
                    <textarea name="Loi_The" readonly>Trung thành tuyệt đối, không bao giờ phản bội đại ca.</textarea>
                </div>

                <p style="color: #ff5252; margin: 20px 0 10px 0; font-weight: bold; text-align: center;">Bạn có đồng ý phê duyệt đơn này không?</p>
                
                <div class="choices">
                    <button type="button" class="btn-accept" onclick="submitAndFinish('Đồng ý chấp thuận')">1. Chấp nhận</button>
                    <button type="button" class="btn-no-choice" onmouseover="moveButton(this)" onclick="submitAndFinish('Buộc phải chấp nhận')">2. Không thể nào từ chối</button>
                </div>
            </form>
        </div>
    </div>

    <!-- TRANG 3: Thông báo thành công -->
    <div id="step-3" class="step">
        <div class="form-content success-box">
            <h2>🎉 Chúc mừng bạn đã tuyển được 1 thành viên chất lượng!</h2>
            <p style="font-size: 18px; margin-bottom: 20px;">Xin đừng ăn hiếp thành viên này nữa nhé!</p>
            <p style="color: #888; font-size: 14px;">(Thông tin phê duyệt đã được gửi thẳng về email của chủ nhân đơn).</p>
        </div>
    </div>

</div>

<script>
    let reviewerName = "";

    function goToStep2() {
        const input = document.getElementById('reviewer-name').value.trim();
        if(input === "") {
            alert("Vui lòng nhập tên của bạn trước khi xem đơn!");
            return;
        }
        reviewerName = input;
        document.getElementById('hidden-reviewer').value = reviewerName;
        
        // Chuyển sang trang 2
        document.getElementById('step-1').classList.remove('active');
        document.getElementById('step-2').classList.add('active');
        document.getElementById('header-title').innerText = "Đơn Xin Gia Nhập Của Nguyễn Hoàng Thông";
    }

    // Hiệu ứng nút "Không thể nào từ chối" tự chạy trốn cho vui (tùy chọn)
    function moveButton(btn) {
        // Bạn có thể thêm hiệu ứng né chuột ở đây nếu thích, hiện tại bấm vào vẫn tính là chọn dòng 2
    }

    function submitAndFinish(choiceType) {
        // Tạo thêm một trường ẩn để gửi kết quả lựa chọn (Chấp nhận hay Không thể từ chối)
        const form = document.getElementById('apply-form');
        let inputChoice = document.createElement('input');
        inputChoice.type = 'hidden';
        inputChoice.name = 'Ket_Qua_Duyet';
        inputChoice.value = choiceType;
        form.appendChild(inputChoice);

        // Gửi dữ liệu ngầm đi qua Formspree bằng AJAX để không bị chuyển trang đi nơi khác
        const formData = new FormData(form);
        fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: { 'Accept': 'application/json' }
        }).then(response => {
            // Chuyển sang trang 3
            document.getElementById('step-2').classList.remove('active');
            document.getElementById('step-3').classList.add('active');
            document.getElementById('header-title').innerText = "Hoàn Tất Tuyển Quân";
        }).catch(error => {
            // Nếu có lỗi mạng thì vẫn cho qua trang 3 để người dùng không bị kẹt
            document.getElementById('step-2').classList.remove('active');
            document.getElementById('step-3').classList.add('active');
        });
    }
</script>

</body>
</html>
